id: com.ictrek.mcphub
name:
  zh-CN: MCPHub
  en: MCPHub
description:
  zh-CN: MCP 服务管理与统一接入，支持 VOS 自动登录、私有服务和受控共享。
  en: MCP server management and gateway with VOS sign-in, private servers and controlled
    sharing.
version: __APP_VERSION__
author: ictrek
category:
  - ai
dependencies:
  apps:
    - id: com.ictrek.v-scheduler
      version: '*'
      optional: false
icon: icon.png
arch:
  - amd64
  - arm64
oauth2:
  client:
    id: com.ictrek.mcphub
    client_type: public
    grant_types:
      - authorization_code
      - refresh_token
    response_types:
      - code
    scopes:
      - openid
      - profile
      - email
    pkce_required: true
    token_endpoint_auth_method: none
require-profiles: true
profiles:
  - name: amd-cpu
    title:
      zh-CN: AMD64 CPU（推荐）
      en: amd-without-cuda
    description:
      zh-CN: 管理与远程 MCP 无需 GPU。NVIDIA profile 仅暴露 GPU 驱动，服务自身需另配匹配的 CUDA 依赖。
      en: Management and remote MCP need no GPU. NVIDIA profiles expose drivers only;
        local GPU servers need compatible CUDA dependencies.
    caps:
      arch: amd64
    conflicts:
      - arm-cpu
      - amd-cuda
      - arm-cuda
      - jetson-orin
      - jetson-thor
      - dgx-spark
  - name: arm-cpu
    title:
      zh-CN: ARM64 CPU（推荐，含 Jetson/Thor）
      en: arm-without-cuda
    description:
      zh-CN: 管理与远程 MCP 无需 GPU。NVIDIA profile 仅暴露 GPU 驱动，服务自身需另配匹配的 CUDA 依赖。
      en: Management and remote MCP need no GPU. NVIDIA profiles expose drivers only;
        local GPU servers need compatible CUDA dependencies.
    caps:
      arch: arm64
    conflicts:
      - amd-cpu
      - amd-cuda
      - arm-cuda
      - jetson-orin
      - jetson-thor
      - dgx-spark
  - name: amd-cuda
    title:
      zh-CN: AMD64 NVIDIA（可选）
      en: amd
    description:
      zh-CN: 管理与远程 MCP 无需 GPU。NVIDIA profile 仅暴露 GPU 驱动，服务自身需另配匹配的 CUDA 依赖。
      en: Management and remote MCP need no GPU. NVIDIA profiles expose drivers only;
        local GPU servers need compatible CUDA dependencies.
    caps:
      arch: amd64
      software:
        - cuda
    conflicts:
      - amd-cpu
      - arm-cpu
      - arm-cuda
      - jetson-orin
      - jetson-thor
      - dgx-spark
  - name: arm-cuda
    title:
      zh-CN: ARM64 NVIDIA（可选）
      en: arm
    description:
      zh-CN: 管理与远程 MCP 无需 GPU。NVIDIA profile 仅暴露 GPU 驱动，服务自身需另配匹配的 CUDA 依赖。
      en: Management and remote MCP need no GPU. NVIDIA profiles expose drivers only;
        local GPU servers need compatible CUDA dependencies.
    caps:
      arch: arm64
      software:
        - cuda
      device-type: generic
    conflicts:
      - amd-cpu
      - arm-cpu
      - amd-cuda
      - jetson-orin
      - jetson-thor
      - dgx-spark
  - name: jetson-orin
    title:
      zh-CN: Jetson / L4T NVIDIA（可选）
      en: l4t
    description:
      zh-CN: 管理与远程 MCP 无需 GPU。NVIDIA profile 仅暴露 GPU 驱动，服务自身需另配匹配的 CUDA 依赖。
      en: Management and remote MCP need no GPU. NVIDIA profiles expose drivers only;
        local GPU servers need compatible CUDA dependencies.
    caps:
      arch: arm64
      software:
        - cuda
      device-type:
        - any-of:
            - jetson-orin
            - l4t
            - jetson
    conflicts:
      - amd-cpu
      - arm-cpu
      - amd-cuda
      - arm-cuda
      - jetson-thor
      - dgx-spark
  - name: jetson-thor
    title:
      zh-CN: Jetson Thor NVIDIA（可选）
      en: Jetson Thor
    description:
      zh-CN: 管理与远程 MCP 无需 GPU。NVIDIA profile 仅暴露 GPU 驱动，服务自身需另配匹配的 CUDA 依赖。
      en: Management and remote MCP need no GPU. NVIDIA profiles expose drivers only;
        local GPU servers need compatible CUDA dependencies.
    caps:
      arch: arm64
      software:
        - cuda
      device-type:
        - any-of:
            - jetson-thor
            - thor
            - thor-spark
    conflicts:
      - amd-cpu
      - arm-cpu
      - amd-cuda
      - arm-cuda
      - jetson-orin
      - dgx-spark
  - name: dgx-spark
    title:
      zh-CN: DGX Spark NVIDIA（可选）
      en: DGX Spark
    description:
      zh-CN: 管理与远程 MCP 无需 GPU。NVIDIA profile 仅暴露 GPU 驱动，服务自身需另配匹配的 CUDA 依赖。
      en: Management and remote MCP need no GPU. NVIDIA profiles expose drivers only;
        local GPU servers need compatible CUDA dependencies.
    caps:
      arch: arm64
      software:
        - cuda
      device-type:
        - any-of:
            - dgx-spark
            - spark
    conflicts:
      - amd-cpu
      - arm-cpu
      - amd-cuda
      - arm-cuda
      - jetson-orin
      - jetson-thor

storage:
  directories:
    - path: data
      mode: '0700'
