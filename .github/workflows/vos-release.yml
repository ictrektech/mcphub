name: VOS MCPHub Pull Package Release
on:
  push:
    tags: ['vos-mcphub-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Tags carry the previous `v<package>` release marker. Without them the
          # release-notes step cannot build `<previous>..HEAD` and fails hard.
          fetch-tags: true
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#vos-mcphub-v}"
          python3 ictrek.app/scripts/vos_version.py check "$VERSION"
          [[ "$(tr -d '[:space:]' < ictrek.app/VERSION)" == "$VERSION" ]]
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MCPHUB_PACKAGE_DIR=$HOME/dev/build/mcphub/ictrek.app" >> "$GITHUB_ENV"
      - name: Write Feishu credentials
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path.home() / '.feishu.components.json'
          path.touch(mode=0o600)
          path.write_text(json.dumps({'feishu_app_id': os.environ['FEISHU_APP_ID'], 'feishu_app_secret': os.environ['FEISHU_APP_SECRET']}))
          PY
      - name: Verify and build pull package from published image records
        run: |
          mkdir -p "$HOME/dev/build/mcphub/tmp"
          export TMPDIR="$HOME/dev/build/mcphub/tmp" PYTHONDONTWRITEBYTECODE=1
          python3 -m pip install --cache-dir "$HOME/dev/build/mcphub/pip" pyyaml
          python3 -m unittest discover -s ictrek.app/scripts -p 'test_vos_package.py'
          bash ictrek.app/scripts/package.sh
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null 2>&1 || true
          PREVIOUS="$(gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[0].tagName // ""')"
          # A release can exist without its tag in this checkout (deleted tag, tag
          # created elsewhere, shallow/tag-less fetch). `git log A..HEAD` then dies
          # with "ambiguous argument" and takes the whole job down, so verify the
          # ref and fall back to the newest local release tag.
          if [[ -n "$PREVIOUS" ]] && ! git rev-parse -q --verify "refs/tags/${PREVIOUS}" >/dev/null; then
            echo "::warning::release tag ${PREVIOUS} is not in this checkout; using the newest local v<version> tag"
            PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          fi
          {
            echo 'VOS MCPHub pull package. Service images are recorded in the canonical Feishu spreadsheet.'
            echo
            if [[ -n "$PREVIOUS" ]] && git rev-parse -q --verify "refs/tags/${PREVIOUS}" >/dev/null; then
              echo "Changes since ${PREVIOUS}:"
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS}..HEAD"
            else
              echo 'Initial VOS package release.'
            fi
          } > "$HOME/dev/build/mcphub/release-notes.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag "v${PACKAGE_VERSION}" "$GITHUB_SHA"
          git push origin "v${PACKAGE_VERSION}"
          gh release create "v${PACKAGE_VERSION}" "$MCPHUB_PACKAGE_DIR/mcphub_${PACKAGE_VERSION}_pull.tar" \
            --verify-tag --latest --title "v${PACKAGE_VERSION}" --notes-file "$HOME/dev/build/mcphub/release-notes.md"
      - name: Open approved App Store tunnel
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: bash ictrek.app/scripts/appstore_tunnel.sh open
      - name: Publish VOS App Store package
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 300 \
            -F "package=@$MCPHUB_PACKAGE_DIR/mcphub_${PACKAGE_VERSION}_pull.tar" -F force=true \
            http://127.0.0.1:18899/api/appstore/apps > "$HOME/dev/build/mcphub/publish-result.json"
          python3 - <<'PY'
          import json, os, pathlib, re, time, urllib.request

          BASE = 'http://127.0.0.1:18899'
          APP_ID = 'com.ictrek.mcphub'
          VERSION = os.environ['PACKAGE_VERSION']
          DEFAULT_ARCHIVE = f'appstore/apps/{APP_ID}/{VERSION}/app.tar.gz'

          result = json.loads((pathlib.Path.home() / 'dev/build/mcphub/publish-result.json').read_text())
          if result.get('code') != 0:
              raise SystemExit(
                  'VOS App Store rejected the upload: ' + json.dumps(result, ensure_ascii=False)[:2000])

          def fetch_record():
              with urllib.request.urlopen(f'{BASE}/api/appstore/apps/{APP_ID}', timeout=30) as response:
                  return json.load(response)

          def version_names(detail):
              raw = detail.get('versions') or []
              names = []
              for entry in raw:
                  if isinstance(entry, str):
                      names.append(entry)
                  elif isinstance(entry, dict):
                      for key in ('version', 'tag', 'name'):
                          if isinstance(entry.get(key), str):
                              names.append(entry[key])
                              break
              return names

          def archive_head(path):
              request = urllib.request.Request(f'{BASE}/store/{path}', headers={'Range': 'bytes=0-1'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read(2)

          def version_key(name):
              """(`prefix parts`, revision) so `vos.09 < vos.10` compares numerically."""
              match = re.fullmatch(r'(.+?)[.-]vos\.([0-9]+)', str(name or ''))
              if not match:
                  return None
              parts = []
              for piece in re.split(r'[.-]', match.group(1)):
                  parts.append((0, int(piece)) if piece.isdigit() else (1, piece))
              return (tuple(parts), int(match.group(2)))

          def problems_of(record):
              """Success means: the version is in the catalog, its archive downloads,
              and - unless this is a deliberate rollback to an older version - the
              catalog actually promotes it. A newer release that stays behind an
              older `current_version` is a broken publish, not a rounding error."""
              detail = record.get('data') or {}
              archive = detail.get('app_tar_gz') or {}
              current = detail.get('current_version')
              found = []
              if record.get('code') != 0:
                  found.append(f"code={record.get('code')!r}")
              if detail.get('id') != APP_ID:
                  found.append(f"id={detail.get('id')!r}, expected {APP_ID!r}")
              names = version_names(detail)
              if VERSION not in names:
                  found.append(f"version {VERSION!r} missing from versions={names!r}")
              path = archive.get('download_path') or DEFAULT_ARCHIVE
              if VERSION not in path:
                  found.append(f"download_path={path!r} does not point at {VERSION!r}")
              if current != VERSION:
                  ours, theirs = version_key(VERSION), version_key(current)
                  if ours is None or theirs is None or ours >= theirs:
                      found.append(
                          f"current_version={current!r}, expected {VERSION!r}: the catalog did not "
                          f'promote the version that was just published')
                  else:
                      print(f'::warning::publishing older {VERSION!r} while the catalog is at '
                            f'{current!r}; leaving the newer version as current')
              if not found:
                  try:
                      head = archive_head(path)
                  except Exception as error:  # noqa: BLE001 - report whatever the store did
                      found.append(f'archive {path!r} unreachable: {error}')
                  else:
                      if head != b'\x1f\x8b':
                          found.append(f'archive {path!r} is not gzip: {head!r}')
              return detail, found

          # The catalog can lag the upload by a few seconds; keep polling until it
          # catches up instead of failing on the first look.
          deadline = time.time() + float(os.environ.get('PUBLISH_CHECK_TIMEOUT', '120'))
          while True:
              record = fetch_record()
              detail, problems = problems_of(record)
              if not problems:
                  break
              if time.time() >= deadline:
                  print('app store record:', json.dumps(detail, ensure_ascii=False)[:3000])
                  raise SystemExit(
                      'Published App Store record does not match the release: ' + '; '.join(problems))
              time.sleep(5)

          print(f'VOS App Store publication verified: {APP_ID} {VERSION}')
          PY
      - name: Close App Store tunnel
        if: always()
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
        run: bash ictrek.app/scripts/appstore_tunnel.sh close
      - name: Remove temporary Feishu credentials
        if: always()
        run: rm -f "$HOME/.feishu.components.json"
